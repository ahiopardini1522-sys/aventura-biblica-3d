name: Compilar y verificar

# En cada subida se hace una verificación real con Godot:
#   1. validar     -> importa el proyecto, compila todos los scripts y ejecuta la prueba de humo.
#   2. capturas    -> abre cada pantalla con una pantalla virtual y guarda imágenes.
#   3. android     -> exporta el APK de depuración con las plantillas oficiales de Godot.
#   4. resumen     -> publica registros e imágenes en la rama "ci-artifacts" para poder revisarlos.
# Al subir a la rama "main" se publica además el APK en el pre-lanzamiento "latest-debug".

on:
  push:
    branches-ignore:
      - ci-artifacts
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  APK_NAME: aventura-biblica-3d-debug.apk

jobs:
  validar:
    name: Validar proyecto (Godot sin pantalla)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Importar el proyecto
        run: |
          mkdir -p logs
          # La primera importación crea la lista de clases del proyecto; la segunda ya compila con ella.
          godot --headless --path . --import 2>&1 | tee logs/import-1.log || true
          godot --headless --path . --import 2>&1 | tee logs/import-2.log || true

      - name: Prueba de humo
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/smoke_test.gd 2>&1 | tee logs/smoke_test.log

      - name: Buscar errores de GDScript en los registros
        if: always()
        run: |
          if grep -n -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" logs/import-2.log logs/smoke_test.log; then
            echo "::error::Hay errores de GDScript en los registros"
            exit 1
          fi
          echo "Sin errores de GDScript en los registros."

      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-validar
          path: logs/
          if-no-files-found: warn

  capturas:
    name: Capturas de pantalla (pantalla virtual)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Instalar pantalla virtual y OpenGL por software
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libasound2t64 libpulse0 \
            libxi6 libxcursor1 libxinerama1 libxrandr2 libfontconfig1

      - name: Importar el proyecto
        run: |
          mkdir -p logs shots
          godot --headless --path . --import 2>&1 | tee logs/capture-import-1.log || true
          godot --headless --path . --import 2>&1 | tee logs/capture-import-2.log || true

      - name: Tomar capturas
        run: |
          export SHOT_DIR="$PWD/shots"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x720x24" \
            godot --path . --rendering-driver opengl3 --resolution 1600x720 \
            --script res://tools/capture_screens.gd 2>&1 | tee logs/capture.log
          ls -la shots

      - name: Guardar capturas y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            shots/
            logs/
          if-no-files-found: warn

  android:
    name: Exportar APK de Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar el SDK de Android
        run: |
          set -eo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK de Android: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"
          echo "ANDROID_SDK_DIR=$SDK" >> "$GITHUB_ENV"

      - name: Crear llave de depuración y ajustes del editor
        run: |
          set -eo pipefail
          keytool -genkey -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          for settings_file in editor_settings-4.7.tres editor_settings-4.tres; do
            cat > "$HOME/.config/godot/$settings_file" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_DIR"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Importar el proyecto
        run: |
          mkdir -p logs build/android
          godot --headless --path . --import 2>&1 | tee logs/android-import-1.log || true
          godot --headless --path . --import 2>&1 | tee logs/android-import-2.log || true

      - name: Exportar el APK de depuración
        run: |
          set -o pipefail
          godot --headless --path . --export-debug "Android" "build/android/$APK_NAME" 2>&1 | tee logs/android-export.log
          ls -la build/android
          test -s "build/android/$APK_NAME"

      - name: Revisar el APK
        run: |
          set -eo pipefail
          BT="$ANDROID_SDK_DIR/build-tools/35.0.1"
          APK="build/android/$APK_NAME"
          {
            echo "== aapt2 dump badging (resumen) =="
            "$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -v -E "^application-label-" | head -n 40 || true
            echo
            echo "== permisos declarados =="
            "$BT/aapt2" dump permissions "$APK" 2>&1 || true
            echo
            echo "== AndroidManifest.xml (SDK mínimo, orientación y actividad de inicio) =="
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>&1 \
              | grep -E "minSdkVersion|targetSdkVersion|screenOrientation|glEsVersion|android.intent.action.MAIN|android.intent.category.LAUNCHER|uses-permission|android:label|activity" || true
            echo
            echo "== contenido del APK (assets y bibliotecas) =="
            unzip -l "$APK" | grep -E "assets/|lib/" || true
            echo
            echo "== apksigner verify =="
            "$BT/apksigner" verify --verbose --print-certs "$APK" || true
            echo
            echo "== tamaño =="
            ls -la "$APK"
          } 2>&1 | tee logs/android-apk-info.log

      - name: Probar el paquete de datos exportado (arranque desde el .pck)
        # Se exporta solo el paquete de datos y se arranca el juego únicamente desde él,
        # en una carpeta vacía, para comprobar que todo lo necesario viaja en la exportación.
        run: |
          set -o pipefail
          mkdir -p build/pack logs /tmp/packrun
          godot --headless --path . --export-pack "Android" build/pack/game.pck 2>&1 | tee logs/pack-export.log
          ls -la build/pack
          cd /tmp/packrun
          godot --headless --main-pack "$GITHUB_WORKSPACE/build/pack/game.pck" --quit-after 240 2>&1 | tee "$GITHUB_WORKSPACE/logs/pack-run.log"
          if grep -n -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file|No loader found" "$GITHUB_WORKSPACE/logs/pack-run.log"; then
            echo "::error::El juego empaquetado tiene errores al arrancar"
            exit 1
          fi
          if ! grep -q "menú principal listo" "$GITHUB_WORKSPACE/logs/pack-run.log"; then
            echo "::error::El juego empaquetado no llegó a mostrar el menú principal"
            exit 1
          fi
          echo "El juego empaquetado arrancó, mostró el menú principal y no tuvo errores de scripts ni de recursos."

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: aventura-biblica-3d-apk-debug
          path: build/android/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-android
          path: logs/
          if-no-files-found: warn

      - name: Publicar el APK en el pre-lanzamiento "latest-debug"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug "build/android/$APK_NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Última versión de prueba (APK de depuración)" \
            --notes "APK de depuración generado automáticamente desde la rama main (commit ${GITHUB_SHA::7}). Para instalarlo en Android hay que permitir la instalación de apps desconocidas."

      - name: Publicar la versión numerada (pre-lanzamiento con el número de versión)
        # Además de "latest-debug" (que se reemplaza en cada subida) queda un pre-lanzamiento con el
        # número de versión de project.godot y un nombre de archivo claro, con un enlace que no cambia.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          VERSION="$(grep -oP '^config/version="\K[^"]+' project.godot)"
          NAMED="build/android/aventura-biblica-3d-v${VERSION}-debug.apk"
          cp "build/android/$APK_NAME" "$NAMED"
          gh release delete "v${VERSION}" --cleanup-tag --yes || true
          gh release create "v${VERSION}" "$NAMED" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Versión de prueba ${VERSION} (APK de depuración)" \
            --notes "APK de depuración de la versión ${VERSION}, generado desde la rama main (commit ${GITHUB_SHA::7}). GitHub Actions comprobó las pruebas automáticas, la exportación y el arranque del paquete de datos; no sustituye una prueba en un teléfono real. Para instalarlo hay que permitir la instalación de apps desconocidas. Cada APK de prueba se firma con una llave de depuración nueva: si ya tienes instalada otra versión de prueba, desinstálala antes de instalar esta."

  resumen:
    name: Resumen de resultados
    needs: [validar, capturas, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{registros-*,capturas}"
          merge-multiple: true

      - name: Publicar resultados en la rama ci-artifacts
        env:
          RESULT_VALIDAR: ${{ needs.validar.result }}
          RESULT_CAPTURAS: ${{ needs.capturas.result }}
          RESULT_ANDROID: ${{ needs.android.result }}
        run: |
          set -eo pipefail
          mkdir -p /tmp/report
          cp -r artifacts/. /tmp/report/ || true
          cd /tmp/report
          {
            echo "# Resultado de la compilación"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Rama: ${GITHUB_REF_NAME}"
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- validar: ${RESULT_VALIDAR}"
            echo "- capturas: ${RESULT_CAPTURAS}"
            echo "- android: ${RESULT_ANDROID}"
          } > STATUS.md
          git init -q -b ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI ${GITHUB_SHA::7} (${GITHUB_REF_NAME}): validar=${RESULT_VALIDAR} capturas=${RESULT_CAPTURAS} android=${RESULT_ANDROID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-artifacts
